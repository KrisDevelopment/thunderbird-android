<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Import from Thunderbird for Android</title>
    <script src="options.js" defer></script>
  </head>
  <body>
    <h1>Import from Thunderbird for Android</h1>
    <p>Choose the <code>.tbam</code> file exported from Thunderbird for Android and enter the passphrase used for the export.</p>
    <p><label>Archive <input type="file" id="archive" accept=".tbam"></label></p>
    <p><label>Passphrase <input type="password" id="passphrase" autocomplete="off"></label></p>
    <p><button type="button" id="import">Import accounts</button></p>
    <pre id="status" role="status"></pre>
  </body>
</html>
